<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMG STORE | Painel</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><a class="brand" href="index.html"><img src="JMG-LOGO.jpeg" alt="JMG Store"></a><strong style="margin:auto">PAINEL ADMINISTRATIVO</strong><a class="btn btn-outline" href="index.html">Voltar à loja</a></header><main class="section"><div id="adminLogin" class="modal" style="display:block;margin:auto"><span class="eyebrow">JMG STORE</span><h2>Acesso administrativo</h2><p class="muted">Entre com uma conta marcada como admin no Supabase.</p><form id="adminAuth"><label>E-mail<input id="adminEmail" type="email" required></label><label>Senha<input id="adminPassword" type="password" required></label><button class="btn btn-gold full">Entrar</button></form><p id="adminMsg" class="muted"></p></div><div id="adminPanel" class="hidden"><div class="row-heading"><div><span class="eyebrow">Gestão</span><h2>Produtos e pedidos</h2></div><button class="btn btn-outline" id="adminLogout">Sair</button></div><div class="admin-tabs"><button class="btn btn-gold" data-tab="products">Produtos</button><button class="btn btn-outline" data-tab="orders">Pedidos</button></div><section id="adminProducts"><div class="checkout-box"><h3>Novo produto</h3><form id="productForm" class="admin-form"><input type="hidden" id="productId"><label>Nome<input id="productName" required></label><label>Categoria<select id="productCategory"><option>Camisetas</option><option>Blusas</option><option>Bonés</option><option>Pochetes</option></select></label><label>Preço<input id="productPrice" type="number" step="0.01" required></label><label>Estoque<input id="productStock" type="number" min="0" required></label><label>Tamanhos<input id="productSizes" placeholder="P, M, G, GG"></label><label>Imagem URL<input id="productImage"></label><label>Descrição<textarea id="productDescription"></textarea></label><label>Etiqueta<input id="productTag" placeholder="Novo / Destaque"></label><label>Ícone<input id="productIcon" value="👕"></label><label><input id="productFeatured" type="checkbox"> Destaque</label><button class="btn btn-gold">Salvar produto</button><button type="button" class="btn btn-outline" id="clearProduct">Limpar</button></form></div><div id="adminProductList"></div></section><section id="adminOrders" class="hidden"><div id="adminOrderList"></div></section></div></main><div id="adminToast" class="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
